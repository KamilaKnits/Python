<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=h1, initial-scale=1.0">
    <title>Records</title>
</head>

<body>
    <h1>Search for sales records</h1>
    <form action="" method="POST">
        {% csrf_token %}
        {{form}}
        <button type="submit">search</button>
    </form>
    <br>

    {% if sales_df %}
    {{sales_df|safe}}
    <br>
    <img src="data:image/png;base64, {{chart|safe}}" alt="">
    {% else %}
    <h3>no data</h3>
    {% endif %}

    <a href="{%url 'logout' %}">Logout</a>

</body>

</html>
