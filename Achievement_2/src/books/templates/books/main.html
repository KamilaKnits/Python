<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>
</head>

<body>
    <h1>Book List</h1> {% comment%} HTML tag for heading {% endcomment%}
    
    <a href="{%url 'logout' %}">Logout</a>
    
    <table border="1" cellpadding="5" cellspacing="5">

        <tr>
            <td>Book Titles</td>
            <td>Book Images</td>
        </tr>

        {% for object in object_list %}

        <tr>
            <td><a href="{{object.get_absolute_url}}"> {% comment%} add links to book names {% endcomment%}
                    {{object.name}}
                </a></td>
            <td><img src="{{object.pic.url}}" width="150" height="200" /></td>

        </tr>
        {% endfor %}

    </table>
</body>

</html>
